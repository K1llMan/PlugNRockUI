<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 200" width="2400" height="200">
 <defs>
  <style>
   .fret-num {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-weight: 900;
    text-anchor: middle;
    dominant-baseline: central;
   }
  </style>
 </defs>
 
 <!-- 1. ОБЛАСТИ ПРОСМОТРА (VIEWS) — 1..24 лад, шаг строго 100 -->
 <view id="fret-1" viewBox="0 50 100 100"/>
 <view id="fret-2" viewBox="100 50 100 100"/>
 <view id="fret-3" viewBox="200 50 100 100"/>
 <view id="fret-4" viewBox="300 50 100 100"/>
 <view id="fret-5" viewBox="400 50 100 100"/>
 <view id="fret-6" viewBox="500 50 100 100"/>
 <view id="fret-7" viewBox="600 50 100 100"/>
 <view id="fret-8" viewBox="700 50 100 100"/>
 <view id="fret-9" viewBox="800 50 100 100"/>
 <view id="fret-10" viewBox="900 50 100 100"/>
 <view id="fret-11" viewBox="1000 50 100 100"/>
 <view id="fret-12" viewBox="1100 0 100 200"/>
 <view id="fret-13" viewBox="1200 50 100 100"/>
 <view id="fret-14" viewBox="1300 50 100 100"/>
 <view id="fret-15" viewBox="1400 50 100 100"/>
 <view id="fret-16" viewBox="1500 50 100 100"/>
 <view id="fret-17" viewBox="1600 50 100 100"/>
 <view id="fret-18" viewBox="1700 50 100 100"/>
 <view id="fret-19" viewBox="1800 50 100 100"/>
 <view id="fret-20" viewBox="1900 50 100 100"/>
 <view id="fret-21" viewBox="2000 50 100 100"/>
 <view id="fret-22" viewBox="2100 50 100 100"/>
 <view id="fret-23" viewBox="2200 50 100 100"/>
 <view id="fret-24" viewBox="2300 0 100 200"/>
 
 <!-- 2. ГРАФИКА ДЛЯ КАЖДОГО ЛАДА (1..24) -->
 
 <!-- Лад 1 - синий -->
 <g id="art-fret-1" transform="translate(0, 50)">
  <text class="fret-num" x="50" y="50" font-size="85" fill="#00aaff">1</text>
 </g>
 
 <g id="art-fret-2" transform="translate(100, 50)"></g>
 
 <!-- Лад 3 - красный -->
 <g id="art-fret-3" transform="translate(200, 50)">
  <text class="fret-num" x="50" y="50" font-size="85" fill="#ff3333">3</text>
 </g>
 
 <g id="art-fret-4" transform="translate(300, 50)"></g>
 
 <!-- Лад 5 - жёлтый -->
 <g id="art-fret-5" transform="translate(400, 50)">
  <text class="fret-num" x="50" y="50" font-size="85" fill="#ffdd00">5</text>
 </g>
 
 <g id="art-fret-6" transform="translate(500, 50)"></g>
 
 <!-- Лад 7 - зелёный -->
 <g id="art-fret-7" transform="translate(600, 50)">
  <text class="fret-num" x="50" y="50" font-size="85" fill="#00dd44">7</text>
 </g>
 
 <g id="art-fret-8" transform="translate(700, 50)"></g>
 
 <!-- Лад 9 - розовый/фиолетовый -->
 <g id="art-fret-9" transform="translate(800, 50)">
  <text class="fret-num" x="50" y="50" font-size="85" fill="#cc99ff">9</text>
 </g>
 
 <g id="art-fret-10" transform="translate(900, 50)"></g>
 <g id="art-fret-11" transform="translate(1000, 50)"></g>
 
 <!-- Лад 12 - синий (вертикальный слот 100x200, две цифры) -->
 <g id="art-fret-12" transform="translate(1100, 0)">
  <text class="fret-num" x="50" y="50" font-size="85" fill="#00aaff">1</text>
  <text class="fret-num" x="50" y="150" font-size="85" fill="#00aaff">2</text>
 </g>
 
 <g id="art-fret-13" transform="translate(1200, 50)"></g>
 <g id="art-fret-14" transform="translate(1300, 50)"></g>
 
 <!-- Лад 15 - красный (две цифры вертикально в 100x100) -->
 <g id="art-fret-15" transform="translate(1400, 50)">
  <text class="fret-num" x="50" y="25" font-size="42" fill="#ff3333">1</text>
  <text class="fret-num" x="50" y="75" font-size="42" fill="#ff3333">5</text>
 </g>
 
 <g id="art-fret-16" transform="translate(1500, 50)"></g>
 
 <!-- Лад 17 - жёлтый (две цифры вертикально в 100x100) -->
 <g id="art-fret-17" transform="translate(1600, 50)">
  <text class="fret-num" x="50" y="25" font-size="42" fill="#ffdd00">1</text>
  <text class="fret-num" x="50" y="75" font-size="42" fill="#ffdd00">7</text>
 </g>
 
 <g id="art-fret-18" transform="translate(1700, 50)"></g>
 
 <!-- Лад 19 - зелёный (две цифры вертикально в 100x100) -->
 <g id="art-fret-19" transform="translate(1800, 50)">
  <text class="fret-num" x="50" y="25" font-size="42" fill="#00dd44">1</text>
  <text class="fret-num" x="50" y="75" font-size="42" fill="#00dd44">9</text>
 </g>
 
 <g id="art-fret-20" transform="translate(1900, 50)"></g>
 
 <!-- Лад 21 - розовый/фиолетовый (две цифры вертикально в 100x100) -->
 <g id="art-fret-21" transform="translate(2000, 50)">
  <text class="fret-num" x="50" y="25" font-size="42" fill="#cc99ff">2</text>
  <text class="fret-num" x="50" y="75" font-size="42" fill="#cc99ff">1</text>
 </g>
 
 <g id="art-fret-22" transform="translate(2100, 50)"></g>
 <g id="art-fret-23" transform="translate(2200, 50)"></g>
 
 <!-- Лад 24 - синий (вертикальный слот 100x200, две цифры) -->
 <g id="art-fret-24" transform="translate(2300, 0)">
  <text class="fret-num" x="50" y="50" font-size="85" fill="#00aaff">2</text>
  <text class="fret-num" x="50" y="150" font-size="85" fill="#00aaff">4</text>
 </g>
</svg>